
[workspace]
resolver = "3"
members = [
    "bom",
    "car",
    "util",
    "deepmap2",
    "car-tests",
    "car-cli",
    "test-support",
    "car-wasm",
]
default-members = ["bom", "deepmap2", "car"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/skytoup/car-parser"
readme = "README.md"

[workspace.dependencies]
deku = { version = "^0.20" }
thiserror = "^2.0"
memmap2 = "^0.9"
lzfse_rust = "0.2.1"
flate2 = "1"
lzvn = "0.1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "^4.6", features = ["derive"] }
rayon = "^1.12"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
